<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --bg-deep: #0f0c29;
    --bg-mid: #1a1a3e;
    --bg-card: rgba(255,255,255,0.06);
    --bg-card-hover: rgba(255,255,255,0.1);
    --glass: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.12);
    --text-primary: #f0eef6;
    --text-secondary: #a8a2c6;
    --text-muted: #6e6888;
    --accent-blue: #6c63ff;
    --accent-cyan: #00d4ff;
    --accent-pink: #ff6bb5;
    --accent-green: #3ddc84;
    --accent-orange: #ff9f43;
    --accent-red: #ff5252;
    --accent-purple: #b388ff;
    --glow-blue: rgba(108,99,255,0.4);
    --glow-cyan: rgba(0,212,255,0.35);
    --glow-green: rgba(61,220,132,0.35);
    --glow-pink: rgba(255,107,181,0.35);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-xl: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(108,99,255,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(0,212,255,0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(255,107,181,0.08) 0%, transparent 50%);
    animation: bgShift 20s ease-in-out infinite alternate;
    z-index: -2;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 30%, rgba(255,255,255,0.15), transparent),
      radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.1), transparent),
      radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,0.12), transparent),
      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.08), transparent);
    background-size: 250px 250px, 300px 300px, 200px 200px, 350px 350px;
    z-index: -1;
    pointer-events: none;
  }

  @keyframes bgShift {
    0%   { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(2%, 3%) rotate(3deg); }
  }

  .app {
    padding: 2rem 1rem;
    max-width: 720px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ====== HOME VIEW ====== */
  .home-view h1 {
    font-size: 32px;
    font-weight: 700;
    background: linear-gradient(135deg, #6c63ff, #00d4ff, #ff6bb5);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientText 4s ease infinite;
    margin-bottom: 10px;
  }

  @keyframes gradientText {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .home-view .intro {
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 2rem;
    line-height: 1.8;
  }

  /* Chapter buttons */
  .chapter-btn {
    width: 100%;
    text-align: left;
    padding: 1.25rem 1.5rem;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
    position: relative;
    overflow: hidden;
  }

  .chapter-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius-lg);
    opacity: 0;
    transition: opacity 0.35s;
  }

  .chapter-btn:nth-child(3)::before {
    background: linear-gradient(135deg, rgba(108,99,255,0.12), rgba(0,212,255,0.08));
  }
  .chapter-btn:nth-child(4)::before {
    background: linear-gradient(135deg, rgba(61,220,132,0.12), rgba(255,159,67,0.08));
  }

  .chapter-btn:hover {
    transform: translateY(-2px);
    border-color: rgba(108,99,255,0.4);
    box-shadow: 0 8px 32px rgba(108,99,255,0.2), 0 0 0 1px rgba(108,99,255,0.1);
  }
  .chapter-btn:hover::before { opacity: 1; }

  .chapter-btn:active { transform: translateY(0); }

  .chapter-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    position: relative;
    z-index: 1;
  }

  .chapter-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 5px;
    position: relative;
    z-index: 1;
  }

  .chevron {
    font-size: 20px;
    color: var(--text-muted);
    transition: transform 0.3s, color 0.3s;
    position: relative;
    z-index: 1;
  }

  .chapter-btn:hover .chevron {
    color: var(--accent-cyan);
    transform: translateX(3px);
  }

  .chevron.open { transform: rotate(180deg); }

  /* ====== TOPICS LIST ====== */
  .topics-list {
    margin-bottom: 20px;
    border-left: 3px solid;
    border-image: linear-gradient(to bottom, var(--accent-blue), var(--accent-cyan), var(--accent-pink)) 1;
    padding-left: 16px;
  }

  .topic-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 16px;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 14px;
    color: var(--text-primary);
    margin-bottom: 4px;
    transition: all 0.25s;
    font-family: 'Inter', sans-serif;
  }

  .topic-btn:hover {
    background: rgba(108,99,255,0.12);
    color: var(--accent-cyan);
    padding-left: 22px;
  }

  .topic-btn.active {
    background: rgba(108,99,255,0.2);
    color: var(--accent-cyan);
    font-weight: 500;
  }

  /* ====== BACK BUTTON ====== */
  .back-btn {
    font-size: 14px;
    color: var(--accent-cyan);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    transition: color 0.2s, gap 0.2s;
  }
  .back-btn:hover { color: var(--accent-blue); gap: 10px; }

  /* ====== CONTENT PANEL ====== */
  .content-panel {
    background: var(--bg-card);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xl);
    padding: 1.75rem;
    margin-bottom: 2rem;
    position: relative;
    overflow: hidden;
  }

  .content-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan), var(--accent-pink), var(--accent-orange));
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  }

  .content-panel h2 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }

  .content-panel .breadcrumb {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 1.25rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* ====== TAB BAR ====== */
  .tab-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .tab {
    padding: 7px 18px;
    border: 1px solid var(--glass-border);
    border-radius: 50px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: var(--bg-card);
    color: var(--text-secondary);
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    font-family: 'Inter', sans-serif;
  }

  .tab:hover {
    background: rgba(108,99,255,0.15);
    border-color: rgba(108,99,255,0.3);
    color: var(--text-primary);
  }

  .tab.active {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 20px var(--glow-blue);
  }

  /* ====== SECTIONS ====== */
  .section { margin-bottom: 1.5rem; }

  .section h3 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 8px;
    padding: 8px 14px;
    background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(0,212,255,0.08));
    border-left: 3px solid var(--accent-blue);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }

  .section p, .section li {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.8;
    margin-bottom: 6px;
  }

  .section p b, .section li b {
    color: var(--accent-cyan);
    font-weight: 600;
  }

  .section ul, .section ol {
    padding-left: 1.4rem;
    margin-top: 6px;
  }

  .section li::marker {
    color: var(--accent-purple);
  }

  /* ====== TRICK BOX ====== */
  .trick-box {
    background: linear-gradient(135deg, rgba(61,220,132,0.1), rgba(61,220,132,0.04));
    border-left: 4px solid var(--accent-green);
    padding: 14px 18px;
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    margin: 14px 0;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .trick-box:hover {
    transform: translateX(4px);
    box-shadow: 0 4px 24px var(--glow-green);
  }

  .trick-box .trick-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-green);
    margin-bottom: 6px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .trick-box p, .trick-box li {
    font-size: 13px;
    color: #8ce8b0;
    line-height: 1.7;
  }

  /* ====== FORMULA BOX ====== */
  .formula-box {
    background: linear-gradient(135deg, rgba(108,99,255,0.12), rgba(179,136,255,0.06));
    border-left: 4px solid var(--accent-purple);
    padding: 12px 18px;
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    margin: 12px 0;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: var(--accent-purple);
    font-weight: 500;
    letter-spacing: 0.3px;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .formula-box:hover {
    transform: translateX(4px);
    box-shadow: 0 4px 24px rgba(179,136,255,0.25);
  }

  /* ====== MCQ SECTION ====== */
  .mcq-section { margin-top: 1.5rem; }

  .mcq-section h3 {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent-orange);
    background: linear-gradient(135deg, rgba(255,159,67,0.15), rgba(255,82,82,0.08));
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 14px;
    border-left: 3px solid var(--accent-orange);
  }

  .mcq {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 14px;
    transition: border-color 0.3s;
  }

  .mcq:hover {
    border-color: rgba(108,99,255,0.25);
  }

  .mcq .q {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 10px;
  }

  .opt {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 14px;
    margin-bottom: 6px;
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    font-family: 'Inter', sans-serif;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
  }

  .opt:hover {
    background: rgba(108,99,255,0.12);
    border-color: rgba(108,99,255,0.35);
    color: var(--text-primary);
    padding-left: 20px;
  }

  .opt.correct {
    background: linear-gradient(135deg, rgba(61,220,132,0.2), rgba(61,220,132,0.08));
    border-color: var(--accent-green);
    color: #8ce8b0;
    box-shadow: 0 0 20px var(--glow-green);
  }

  .opt.wrong {
    background: linear-gradient(135deg, rgba(255,82,82,0.2), rgba(255,82,82,0.08));
    border-color: var(--accent-red);
    color: #ff8a8a;
    box-shadow: 0 0 20px rgba(255,82,82,0.2);
  }

  .opt.reveal-correct {
    background: linear-gradient(135deg, rgba(61,220,132,0.2), rgba(61,220,132,0.08));
    border-color: var(--accent-green);
    color: #8ce8b0;
  }

  .opt:disabled { cursor: default; }
  .opt:disabled:hover { padding-left: 14px; }

  .ans-feedback {
    font-size: 12px;
    margin-top: 8px;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: 500;
    line-height: 1.6;
  }

  .ans-feedback.correct {
    background: rgba(61,220,132,0.15);
    color: var(--accent-green);
    border: 1px solid rgba(61,220,132,0.2);
  }

  .ans-feedback.wrong {
    background: rgba(255,82,82,0.15);
    color: var(--accent-red);
    border: 1px solid rgba(255,82,82,0.2);
  }

  /* ====== INFO BOX (chapter view) ====== */
  .info-box {
    padding: 14px 18px;
    background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(108,99,255,0.06));
    border: 1px solid rgba(0,212,255,0.15);
    border-radius: var(--radius-md);
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* ====== SCROLLBAR ====== */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-deep); }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(var(--accent-blue), var(--accent-purple));
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(var(--accent-cyan), var(--accent-pink));
  }

  /* ====== ANIMATIONS ====== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .content-panel, .chapter-btn, .topic-btn, .info-box {
    animation: fadeInUp 0.5s ease both;
  }

  .chapter-btn:nth-child(2) { animation-delay: 0.05s; }
  .chapter-btn:nth-child(3) { animation-delay: 0.1s; }
  .chapter-btn:nth-child(4) { animation-delay: 0.15s; }

  /* ====== FLOATING ORB DECORATION ====== */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: -1;
    animation: orbFloat 8s ease-in-out infinite alternate;
  }

  .orb-1 {
    width: 300px; height: 300px;
    background: rgba(108,99,255,0.12);
    top: 10%; left: -5%;
    animation-duration: 10s;
  }

  .orb-2 {
    width: 250px; height: 250px;
    background: rgba(0,212,255,0.08);
    bottom: 20%; right: -5%;
    animation-duration: 12s;
    animation-delay: -3s;
  }

  .orb-3 {
    width: 200px; height: 200px;
    background: rgba(255,107,181,0.07);
    top: 50%; left: 40%;
    animation-duration: 9s;
    animation-delay: -5s;
  }

  @keyframes orbFloat {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, -40px) scale(1.1); }
  }

  /* Selection color */
  ::selection {
    background: rgba(108,99,255,0.4);
    color: #fff;
  }
</style>

<!-- Floating orbs for ambiance -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="app" id="root"></div>

      {id:"8.1",title:"Hydrogen",
        content:{
          overview:"Hydrogen is the lightest and most abundant element in the universe. It has atomic number 1 and electronic configuration 1s¹. It can act as both a metal (losing 1e⁻) and a non-metal (gaining 1e⁻), so it's placed separately in the periodic table.",
          subtopics:[
            {title:"8.1.1 Atomic, Nascent & Active Hydrogen",body:"<b>Atomic Hydrogen</b>: Single H atoms formed by passing H₂ through an electric arc between tungsten electrodes. Very reactive, short-lived.<br><b>Nascent Hydrogen</b>: Hydrogen at the moment of liberation from a chemical reaction. E.g., Zn + H₂SO₄ → ZnSO₄ + [H] (nascent). It is a stronger reducing agent than ordinary H₂."},
            {title:"8.1.2 Isotopes of Hydrogen",body:"Three isotopes exist:<br>• Protium (¹H or H) — no neutron, most abundant (99.98%)<br>• Deuterium (²H or D) — 1 neutron, used in heavy water (D₂O)<br>• Tritium (³H or T) — 2 neutrons, radioactive, used in nuclear reactions"},

            {title:"8.1.4 Heavy Water (D₂O)",body:"D₂O is water made with deuterium. Properties: density 1.105 g/mL (heavier than H₂O), MP = 3.82°C, BP = 101.4°C. Used as moderator in nuclear reactors to slow down neutrons. Retards biological processes (toxic in large amounts)."}
          ],
          tricks:["Trick: Hydrogen isotopes — P.D.T. = Protium, Deuterium, Tritium (0,1,2 neutrons). Remember: PDT!","Nascent H = freshly born hydrogen — always more reactive.","Heavy water: D₂O is ~11% heavier than H₂O"],
          formulas:["2H₂ + O₂ → 2H₂O (fuel reaction)","Zn + H₂SO₄ → ZnSO₄ + H₂↑ (nascent H formation)","3Fe + 4H₂O → Fe₃O₄ + 4H₂ (reaction with steam)"],

      {id:"8.2",title:"Oxygen",
        content:{

          subtopics:[
            {title:"8.2.1 Allotropy",body:"Allotropy: same element existing in two or more physical forms in the same physical state. (Greek: allos = other, tropos = forms). Each form is called an allotrope."},
            {title:"8.2.2 Allotropes of Oxygen",body:"• <b>Dioxygen (O₂)</b>: colorless, odorless gas, paramagnetic (2 unpaired e⁻), supports combustion, essential for life.<br>• <b>Ozone (O₃)</b>: pale blue gas with pungent smell, 3 oxygen atoms in angular shape (116.8° bond angle), stronger oxidizing agent than O₂."},
            {title:"8.2.3 Types of Oxides",body:"<b>Acidic oxides</b>: oxides of non-metals, react with base → salt+water. E.g., SO₂, CO₂, NO₂<br><b>Basic oxides</b>: oxides of active metals, react with acid → salt+water. E.g., Na₂O, CaO, MgO<br><b>Amphoteric oxides</b>: react with both acid and base. E.g., Al₂O₃, ZnO<br><b>Neutral oxides</b>: react with neither. E.g., CO, NO, N₂O"}

          tricks:["Trick for oxides: 'Acid-base Ampho-Neutral' — A, B, A+B, Neither (ABAN)","Non-metals → Acidic oxides | Active metals → Basic oxides | Zn, Al → Amphoteric","O₂ is paramagnetic due to 2 unpaired electrons — remember MOT!"],

          mcqs:[
            {q:"Which of the following is an amphoteric oxide?",opts:["Na₂O","CO₂","Al₂O₃","SO₃"],ans:2,exp:"Al₂O₃ reacts with both acids and bases, making it amphoteric."},
            {q:"Oxygen is paramagnetic because:",opts:["It has 8 protons","It has 2 unpaired electrons","It is a gas","It forms O₃"],ans:1,exp:"O₂ has 2 unpaired electrons in its π* antibonding orbitals (MOT), making it paramagnetic."},
            {q:"Which is a neutral oxide?",opts:["SO₂","CaO","CO","Al₂O₃"],ans:2,exp:"CO is a neutral oxide — it neither reacts with acids nor bases."}

      },
      {id:"8.3",title:"Ozone (O₃)",

          overview:"Ozone is an allotrope of oxygen with formula O₃. It is pale blue, has a pungent smell, and is found mainly in the stratosphere (ozone layer, 20–50 km above Earth). It protects us from harmful UV radiation.",

            {title:"8.3.1 Occurrence",body:"Ozone occurs naturally in the stratosphere. It absorbs UV-B and UV-C radiation. Its concentration is measured in Dobson Units (DU). Normal level ~300 DU."},
            {title:"8.3.2 Preparation from Oxygen",body:"Ozone is prepared by passing silent electric discharge through dry oxygen: 3O₂ → 2O₃ (ΔH = +142 kJ/mol). The apparatus used is called an Ozonizer. Siemen's Ozonizer uses two coaxial glass tubes with electrodes."},
            {title:"8.3.3 Structure of Ozone",body:"O₃ is angular/bent shaped. Bond angle = 116.8°. It is a resonance hybrid of two structures. The O–O bond length (1.28 Å) is intermediate between O–O single bond (1.48 Å) and O=O double bond (1.21 Å)."},
            {title:"8.3.4 Test for Ozone",body:"Ozone turns moist starch-iodide paper blue (oxidizes I⁻ to I₂). Also bleaches indigo. Lead sulfide (PbS) is converted to lead sulfate (PbSO₄, white) — this is a specific test for O₃."},
            {title:"8.3.5 Ozone Layer Depletion",body:"CFCs (chlorofluorocarbons) are major culprits. UV breaks CFCs → Cl• radicals → Cl• + O₃ → ClO + O₂ (chain reaction). The ozone hole is largest over Antarctica (discovered 1985). Montreal Protocol (1987) banned CFCs."},
            {title:"8.3.6 Uses of Ozone",body:"• Purification of drinking water (better than Cl₂, leaves no taste)<br>• Bleaching of oils, silk, ivory, starch<br>• Sterilization of air in hospitals<br>• Used in manufacturing H₂O₂, KMnO₄<br>• Ozone therapy in medicine"}
          ],
          tricks:["Remember Ozone preparation: 3O₂ → 2O₃ (silent electric discharge, NOT spark — spark gives O atoms)","Starch-iodide paper test = blue color → confirms ozone","CFCs → Cl• → destroys O₃ (chain reaction, 1 Cl atom destroys 10⁵ O₃ molecules!)","Bond angle 116.8° — bent shape, sp² hybridized central O"],
          formulas:["3O₂ →(silent electric discharge) 2O₃","PbS + 4O₃ → PbSO₄ + 4O₂ (ozone test)","2KI + O₃ + H₂O → 2KOH + I₂ + O₂ (iodide test)","Cl• + O₃ → ClO• + O₂ (ozone depletion)"],
          mcqs:[
            {q:"Which paper turns blue in presence of ozone?",opts:["Litmus paper","Moist starch-iodide paper","pH paper","Filter paper"],ans:1,exp:"Ozone oxidizes I⁻ to I₂, which turns starch blue."},
            {q:"Ozone is prepared by passing through oxygen:",opts:["Spark discharge","Silent electric discharge","UV light","Heat"],ans:1,exp:"Silent electric discharge (not spark) is used because spark would completely dissociate O₂ into atoms."},
            {q:"The bond angle in O₃ is:",opts:["180°","120°","116.8°","109.5°"],ans:2,exp:"O₃ has an angular shape with bond angle 116.8°."},
            {q:"Which protocol banned CFCs?",opts:["Kyoto Protocol","Montreal Protocol","Paris Agreement","Geneva Protocol"],ans:1,exp:"The Montreal Protocol (1987) internationally banned substances that deplete the ozone layer."}
          ]
        }
      },
      {id:"8.4",title:"Nitrogen",
        content:{
          overview:"Nitrogen (N) has atomic number 7, electronic configuration 2,5. It makes up ~78% of the atmosphere. It is a diatomic gas (N₂) with a very strong triple bond (N≡N, bond energy = 945 kJ/mol), making it very unreactive.",
          subtopics:[
            {title:"8.4.1 Reasons for Inertness",body:"• Very high bond dissociation energy of N≡N (945 kJ/mol)<br>• Large ionization energy<br>• Absence of d-orbitals (can't expand octet)<br>• Small atomic size with high electronegativity<br>• Non-polar molecule"},
            {title:"8.4.2 Active Nitrogen",body:"Active nitrogen is an excited, highly reactive form of nitrogen produced by passing electric discharge through N₂ at low pressure. It contains free N atoms in excited state. It can combine with metals, phosphorus, sulfur, and many non-metals directly."},
            {title:"8.4.3 Ammonia (NH₃)",body:"Prepared industrially by Haber's process: N₂ + 3H₂ ⇌ 2NH₃ (450°C, 200 atm, Fe catalyst with Al₂O₃ and K₂O promoters). Lab: Ca(OH)₂ + 2NH₄Cl → CaCl₂ + 2H₂O + 2NH₃↑. Properties: colorless, pungent smell, basic gas, lighter than air, highly soluble in water."},
            {title:"8.4.4 Applications of Ammonia",body:"• Manufacture of fertilizers (urea, ammonium nitrate)<br>• Manufacture of HNO₃ (Ostwald's process)<br>• Refrigerant (liquid ammonia)<br>• Manufacture of explosive (nitroglycerine, TNT)<br>• Cleaning agent"},
            {title:"8.4.5 Harmful Effects of Ammonia",body:"• Irritates respiratory tract<br>• Can cause bronchitis and lung damage<br>• Toxic to aquatic life<br>• Contributes to acid rain (through reactions)<br>• Eye irritant at high concentrations"},
            {title:"8.4.6 Nitric Acid (HNO₃)",body:"Prepared by Ostwald's process: 4NH₃ + 5O₂ → 4NO + 6H₂O (Pt/Rh catalyst, 900°C). 2NO + O₂ → 2NO₂. 3NO₂ + H₂O → 2HNO₃ + NO. Concentrated HNO₃: strong oxidizing acid, fuming, reacts with most metals."},
            {title:"8.4.7 Application of Nitric Acid",body:"• Making fertilizers (ammonium nitrate)<br>• Making explosives (TNT, nitroglycerine, gun cotton)<br>• Making dyes and drugs (nitration of aromatic compounds)<br>• Purification of gold and silver<br>• Etching of metals"},
            {title:"8.4.8 Ring Test for Nitrate Ion",body:"Fresh FeSO₄ solution + conc. H₂SO₄ carefully poured. A brown ring forms at the junction: FeSO₄ + NO → [Fe(NO)]²⁺SO₄ (brown ring complex). This confirms presence of NO₃⁻ (nitrate ion)."}
          ],
          tricks:["N₂ inertness: Remember HALEN = High bond energy, Absence of d-orbitals, Large ionization energy, Electronegativity high, Non-polar","Haber's process: N₂ + 3H₂ → 2NH₃ at '450°C and 200 atm' — remember '4-5-2' (450°C, 200atm, 2NH₃)","Ostwald's: NH₃ → NO → NO₂ → HNO₃ (three steps)","Ring test: Brown ring = Fe²⁺ + NO complex = confirms NO₃⁻"],
          formulas:["N₂ + 3H₂ ⇌ 2NH₃ (Haber's process)","4NH₃ + 5O₂ → 4NO + 6H₂O (Ostwald's step 1)","2NO + O₂ → 2NO₂","3NO₂ + H₂O → 2HNO₃ + NO","Cu + 4HNO₃(conc) → Cu(NO₃)₂ + 2NO₂ + 2H₂O"],
          mcqs:[
            {q:"Haber's process conditions are:",opts:["200°C, 450 atm, Pt catalyst","450°C, 200 atm, Fe catalyst","300°C, 100 atm, Ni catalyst","500°C, 50 atm, V₂O₅ catalyst"],ans:1,exp:"Haber's process: N₂ + 3H₂ → 2NH₃ at 450°C, 200 atm, with Fe catalyst and Al₂O₃/K₂O as promoters."},
            {q:"The brown ring in ring test is due to:",opts:["Fe³⁺ ion","[Fe(NO)]²⁺ complex","Fe(NO₃)₂","FeO compound"],ans:1,exp:"The brown ring is formed by [Fe(NO)]SO₄, a nitroso-iron complex."},
            {q:"Which gas makes up 78% of atmosphere?",opts:["Oxygen","Carbon dioxide","Nitrogen","Argon"],ans:2,exp:"Nitrogen (N₂) constitutes about 78% of Earth's atmosphere."},
            {q:"Ammonia is tested by:",opts:["Red litmus paper (turns blue)","Blue litmus paper (turns red)","Starch paper","Lime water"],ans:0,exp:"Ammonia is alkaline/basic so it turns red litmus paper blue."}
          ]
        }
      },
      {id:"8.5",title:"Halogens",
        content:{
          overview:"Halogens are Group VIIA (17) elements: F, Cl, Br, I, At. The name means 'salt-forming' (Greek: halos = salt, gen = forming). They are the most reactive non-metals and are all diatomic (F₂, Cl₂, Br₂, I₂).",
          subtopics:[
            {title:"8.5.1 General Characteristics",body:"• All have 7 valence electrons (ns²np⁵), 1 electron short of noble gas<br>• High electronegativity (F is highest of all elements)<br>• Exist as diatomic molecules<br>• Strong oxidizing agents (F₂ strongest)<br>• Reactivity decreases: F > Cl > Br > I<br>• Color: F₂=pale yellow, Cl₂=yellow-green, Br₂=red-brown, I₂=violet"},
            {title:"8.5.2 Preparation of Halogens",body:"<b>Fluorine</b>: By electrolysis of KF·2HF (Moissan's method). Cannot be made by chemical oxidation.<br><b>Chlorine</b>: By Deacon's process: 4HCl + O₂ → 2Cl₂ + 2H₂O (CuCl₂ catalyst). Lab: MnO₂ + 4HCl → MnCl₂ + 2H₂O + Cl₂<br><b>Bromine</b>: By oxidation of Br⁻ with Cl₂: 2Br⁻ + Cl₂ → Br₂ + 2Cl⁻<br><b>Iodine</b>: By oxidation of I⁻ with Cl₂ or by oxidation with HNO₃"},
            {title:"8.5.3 Chemical Properties",body:"<b>With H₂</b>: All form HX. H₂ + F₂ → 2HF (even in dark, explosive). H₂ + Cl₂ → 2HCl (in sunlight). H₂ + Br₂ → 2HBr (on heating). H₂ + I₂ ⇌ 2HI (reversible, needs Pt)<br><b>With water</b>: F₂ + H₂O → 2HF + O (reacts violently). Cl₂ + H₂O ⇌ HCl + HOCl (chlorine water — bleaching).<br><b>Displacement</b>: More reactive halogen displaces less reactive from its salt."},
            {title:"8.5.4 Test for Halogens",body:"<b>Cl₂</b>: Turns moist starch-iodide paper blue; bleaches litmus paper<br><b>Br₂</b>: Gives brown fumes; turns starch paper orange-brown<br><b>I₂</b>: Turns starch solution blue-black (most specific test)<br><b>F₂</b>: Etches glass (SiO₂ + 2F₂ → SiF₄ + O₂)"}
          ],
          tricks:["Halogen colors: 'Please Call Brian Ivan' = Pale yellow, Chlorine green, Brown, Indigo/Violet (F, Cl, Br, I)","Reactivity F>Cl>Br>I (top to bottom decreases)","I₂ + starch = blue-black: most important identification test","Electronegativity F=4.0 (highest in all elements!)"],
          formulas:["MnO₂ + 4HCl → MnCl₂ + 2H₂O + Cl₂↑ (lab prep of Cl₂)","Cl₂ + H₂O ⇌ HCl + HOCl (bleaching mechanism)","2KI + Cl₂ → 2KCl + I₂ (halogen displacement)","H₂ + F₂ → 2HF (spontaneous, explosive)"],
          mcqs:[
            {q:"Which halogen is the strongest oxidizing agent?",opts:["Iodine","Bromine","Chlorine","Fluorine"],ans:3,exp:"Fluorine is the strongest oxidizing agent and most electronegative element (EN=4.0)."},
            {q:"The color of iodine vapor is:",opts:["Red-brown","Pale yellow","Violet/Purple","Yellow-green"],ans:2,exp:"I₂ vapor is violet/purple in color."},
            {q:"Starch turns blue-black with:",opts:["Cl₂","Br₂","I₂","F₂"],ans:2,exp:"Iodine (I₂) forms a blue-black colored complex with starch — the classic iodine test."},
            {q:"Chlorine is prepared in the lab by:",opts:["Heating KMnO₄","MnO₂ + conc. HCl","Electrolysis of NaCl","Deacon's process"],ans:1,exp:"Lab preparation: MnO₂ + 4HCl → MnCl₂ + 2H₂O + Cl₂↑"}
          ]
        }
      },
      {id:"8.6",title:"Carbon",
        content:{
          overview:"Carbon (C) has atomic number 6, electronic configuration 2,4. It shows allotropy, catenation (self-linking), and forms millions of organic compounds. Carbon forms 4 covalent bonds (tetravalent).",
          subtopics:[
            {title:"8.6.1 Introduction",body:"Carbon is unique due to:<br>• Catenation: ability to form long chains with itself<br>• Tetravalency: forms 4 bonds<br>• Multiple bonding: can form single, double, and triple bonds<br>• Small atomic size with high bond energy (C-C bond = 347 kJ/mol)"},
            {title:"8.6.2 Allotropes of Carbon",body:"<b>Diamond</b>: Each C bonded to 4 others in 3D tetrahedral structure. Hardest natural substance, non-conductor, very high melting point. sp³ hybridized.<br><b>Graphite</b>: Layered structure, each C bonded to 3 others (sp² hybrid), hexagonal rings. Good conductor (free electrons), lubricant, used in pencils.<br><b>Buckminsterfullerene (C₆₀)</b>: Spherical, 60 C atoms forming pentagons and hexagons (like football). Named after Buckminster Fuller. Superconductor at low temperatures.<br><b>Carbon nanotubes</b>: Cylindrical form, stronger than steel, good conductor."}
          ],
          tricks:["Diamond = sp³ = hardest, non-conductor, 4 bonds each","Graphite = sp² = soft, conductor, 3 bonds + free electron","C₆₀ (Buckminster) = looks like football = 20 hexagons + 12 pentagons","Graphite conducts because of delocalized π electrons between layers"],
          formulas:["C + O₂ → CO₂ (complete combustion)","2C + O₂ → 2CO (incomplete combustion)","C + H₂O → CO + H₂ (water gas, 1000°C)","CO₂ + C → 2CO (reduction)"],
          mcqs:[
            {q:"Which allotrope of carbon is the hardest?",opts:["Graphite","Fullerene","Diamond","Carbon nanotube"],ans:2,exp:"Diamond is the hardest natural substance due to its 3D covalent network structure (sp³ hybridization)."},
            {q:"Graphite conducts electricity because:",opts:["It has ionic bonds","It has delocalized π electrons","It is soft","It has metallic bonds"],ans:1,exp:"Each carbon in graphite is sp² hybridized, leaving one delocalized π electron per carbon that conducts electricity."},
            {q:"Buckminsterfullerene has how many carbon atoms?",opts:["32","60","72","48"],ans:1,exp:"C₆₀ (Buckminsterfullerene) has 60 carbon atoms arranged in 20 hexagons and 12 pentagons."}
          ]
        }
      },
      {id:"8.7",title:"Sulphur",
        content:{
          overview:"Sulphur (S) has atomic number 16, electronic configuration 2,8,6. It shows allotropy and forms many important compounds (SO₂, SO₃, H₂SO₄, H₂S). Found in volcanic regions, underground deposits.",
          subtopics:[
            {title:"8.7.1 Allotropes of Sulphur",body:"<b>Rhombic Sulphur (α-S)</b>: Stable below 96°C. Yellow, rhombic crystals. MP = 113°C. S₈ ring molecules.<br><b>Monoclinic Sulphur (β-S)</b>: Stable between 96°C and 119°C. Needle-shaped crystals, pale yellow. Converts to rhombic below 96°C.<br><b>Plastic Sulphur</b>: Formed by pouring molten sulphur into cold water. Amorphous, elastic like rubber. Unstable, converts to rhombic on standing."},
            {title:"8.7.2 Uses of Sulphur",body:"• Manufacture of H₂SO₄ (most important industrial chemical)<br>• Vulcanization of rubber (adds strength to natural rubber)<br>• Fungicide in agriculture<br>• Manufacture of gunpowder<br>• Making fireworks and matches<br>• Treatment of skin diseases"},
            {title:"8.7.3 Hydrogen Sulphide (H₂S)",body:"Preparation: FeS + H₂SO₄(dil) → FeSO₄ + H₂S↑ (Kipp's apparatus). Properties: colorless, rotten egg smell, poisonous gas, weak diprotic acid. Uses: analytical chemistry (precipitation of metal sulfides), test for oxidizing/reducing agents."}
          ],
          tricks:["Rhombic = stable at RT (room temperature). Monoclinic = stable above 96°C","96°C is the transition temperature of sulphur allotropes","H₂S smell = rotten eggs (never forget!)","S₈ is the ring structure of common sulphur"],
          formulas:["FeS + H₂SO₄ → FeSO₄ + H₂S↑ (lab prep)","S + O₂ → SO₂ (burning sulphur)","2SO₂ + O₂ ⇌ 2SO₃ (Contact process)","SO₃ + H₂O → H₂SO₄"],
          mcqs:[
            {q:"The stable form of sulphur at room temperature is:",opts:["Monoclinic","Plastic","Rhombic","Amorphous"],ans:2,exp:"Rhombic sulphur is the stable form below 96°C (room temperature)."},
            {q:"H₂S smells like:",opts:["Burnt rubber","Rotten eggs","Garlic","Almonds"],ans:1,exp:"H₂S (hydrogen sulphide) has a characteristic rotten egg smell."},
            {q:"The transition temperature of sulphur allotropes is:",opts:["100°C","113°C","96°C","119°C"],ans:2,exp:"96°C is the transition temperature between rhombic and monoclinic sulphur."}
          ]
        }
      }
    ]
  },

      {id:"9.1",title:"Alkali Metals",
        content:{
          overview:"Alkali metals are Group IA (1) elements: Li, Na, K, Rb, Cs, Fr. They have 1 valence electron, are highly reactive, and always form +1 ions. They react vigorously with water, air, and most non-metals.",
          subtopics:[
            {title:"9.1.1 Introduction",body:"Alkali metals: Li (Lithium), Na (Sodium), K (Potassium), Rb (Rubidium), Cs (Caesium), Fr (Francium). Named 'alkali' metals because they react with water to form alkalis (strong bases). All are soft, silvery, and stored under kerosene oil (except Li, stored in liquid paraffin)."},
            {title:"9.1.2 General Characteristics",body:"• Softest metals (can be cut with knife)<br>• Lowest ionization energies<br>• Highest electropositivity<br>• Smallest ionic radii in their period<br>• Form +1 ions only<br>• React with water: 2M + 2H₂O → 2MOH + H₂↑<br>• React with O₂: Na forms Na₂O₂ (peroxide), K forms KO₂ (superoxide), Li forms Li₂O (oxide)<br>• Flame colors: Li=crimson, Na=golden yellow, K=lilac/violet, Rb=red-violet, Cs=blue"},
            {title:"9.1.3 Sodium (Na)",body:"Sodium is the most important alkali metal. Extracted by Down's cell (electrolysis of molten NaCl at 600°C). Cathode: Na is deposited. Anode: Cl₂ is released. Uses: in liquid form as coolant in nuclear reactors, making NaOH, Na₂O₂, as reducing agent."},
            {title:"9.1.4 Sodium Hydroxide (NaOH)",body:"Also called caustic soda. Prepared industrially by Nelson's cell or Castner-Kellner cell (electrolysis of brine). Cathode: 2H₂O + 2e⁻ → H₂ + 2OH⁻. Properties: white solid, highly soluble in water, strong base, deliquescent. Uses: soap making (saponification), paper making, petroleum refining, making rayon, as drain cleaner."},
            {title:"9.1.5 Sodium Carbonate (Na₂CO₃)",body:"Also called washing soda (Na₂CO₃·10H₂O = decahydrate). Prepared by Solvay process: NaCl + NH₃ + CO₂ + H₂O → NaHCO₃ → Na₂CO₃. Properties: white crystalline solid, alkaline solution, used as water softener. Uses: glass making, paper industry, water softening (removes Ca²⁺, Mg²⁺), as laboratory reagent."}
          ],
          tricks:["Alkali metals flame colors: 'Little Naughty Kids Run Crazy Fast' = Li(red), Na(yellow), K(lilac), Rb(red-violet), Cs(blue), Fr","Na forms peroxide Na₂O₂, K forms superoxide KO₂, Li forms oxide Li₂O — reactivity with O₂ increases down the group","Down's cell for Na extraction: cathode=Na, anode=Cl₂","Solvay process for Na₂CO₃: 'Salty Ammonia Creates Soda' (NaCl + NH₃ + CO₂ → Na₂CO₃)"],
          formulas:["2Na + 2H₂O → 2NaOH + H₂↑","Down's cell: 2NaCl → 2Na + Cl₂","2NaOH + CO₂ → Na₂CO₃ + H₂O","Na₂CO₃ + H₂O + CO₂ → 2NaHCO₃ (Solvay process)"],
          mcqs:[
            {q:"Sodium is stored under:",opts:["Water","Alcohol","Kerosene oil","Air"],ans:2,exp:"Sodium is stored under kerosene oil to prevent reaction with moisture and oxygen in air."},
            {q:"The flame color of sodium is:",opts:["Crimson red","Golden yellow","Lilac","Blue"],ans:1,exp:"Sodium gives a characteristic golden yellow flame color used in flame tests."},
            {q:"NaOH is prepared industrially by:",opts:["Solvay process","Down's cell","Electrolysis of brine","Haber's process"],ans:2,exp:"NaOH is prepared by electrolysis of brine (concentrated NaCl solution) using Nelson's or Castner-Kellner cell."},
            {q:"Washing soda is:",opts:["NaOH","NaCl","Na₂CO₃·10H₂O","Na₂SO₄"],ans:2,exp:"Washing soda is sodium carbonate decahydrate: Na₂CO₃·10H₂O."}
          ]
        }
      },
      {id:"9.2",title:"Alkaline Earth Metals",
        content:{
          overview:"Alkaline earth metals are Group IIA (2) elements: Be, Mg, Ca, Sr, Ba, Ra. They have 2 valence electrons, form +2 ions, and are harder and denser than alkali metals. Less reactive than Group 1 but still quite reactive.",
          subtopics:[
            {title:"9.2.1 Introduction",body:"Members: Be (Beryllium), Mg (Magnesium), Ca (Calcium), Sr (Strontium), Ba (Barium), Ra (Radium). Called 'alkaline earth' because their oxides (earths) are alkaline. Ra is radioactive. All are silvery-white metals."},
            {title:"General Properties",body:"• 2 valence electrons in s-orbital (ns²)<br>• Form +2 ions (lose both valence electrons)<br>• Higher melting points than alkali metals<br>• Less reactive than alkali metals<br>• React with water (Mg slowly, Ca vigorously): Ca + 2H₂O → Ca(OH)₂ + H₂↑<br>• Flame colors: Ca=brick red, Sr=crimson, Ba=apple green<br>• Be is anomalous (behaves like Al — diagonal relationship)"}
          ],
          tricks:["Alkaline earth flame colors: 'Ca-SrBa = Brick-CrimsonBaGreen' = Ca(brick red), Sr(crimson), Ba(apple green)","Be is anomalous — diagonal relationship with Al (both form amphoteric oxides)","Group 2 → always +2 ions, Group 1 → always +1 ions","Mg burns brilliantly in air: 2Mg + O₂ → 2MgO (white powder)"],
          formulas:["Ca + 2H₂O → Ca(OH)₂ + H₂↑","2Mg + O₂ → 2MgO","CaCO₃ →(heat) CaO + CO₂ (quicklime)","CaO + H₂O → Ca(OH)₂ (slaked lime)"],
          mcqs:[
            {q:"Flame color of calcium is:",opts:["Golden yellow","Crimson red","Brick red","Apple green"],ans:2,exp:"Calcium gives a brick red flame color in the flame test."},
            {q:"Which Group 2 element is radioactive?",opts:["Barium","Strontium","Radium","Beryllium"],ans:2,exp:"Radium (Ra) is the radioactive member of alkaline earth metals."},
            {q:"Quicklime is:",opts:["Ca(OH)₂","CaCO₃","CaO","CaCl₂"],ans:2,exp:"Quicklime is calcium oxide (CaO), produced by heating limestone (CaCO₃)."}

          `).join('')}
        </div>
        <div id="tab-formulas" style="display:none">
          <div class="section">
            <h3>Key Formulas & Reactions</h3>
            ${c.formulas.map(f=>`<div class="formula-box">${f}</div>`).join('')}
          </div>
        </div>
        <div id="tab-tricks" style="display:none">
          <div class="section">
            <h3>Memory Tricks & Mnemonics</h3>
            ${c.tricks.map(t=>`<div class="trick-box"><div class="trick-title">✦ TRICK</div><p>${t}</p></div>`).join('')}
          </div>
        </div>
        <div id="tab-mcq" style="display:none">
          <div class="mcq-section">
            <h3>MCQ Practice Questions</h3>
            ${c.mcqs.map((m,i)=>`
              <div class="mcq" id="mcq-${i}">
                <div class="q">Q${i+1}. ${m.q}</div>
                ${m.opts.map((o,j)=>`
                  <button class="opt" id="opt-${i}-${j}" onclick="answerMcq(${i},${j},'${mcqKey}',${m.ans},'${m.exp.replace(/'/g,"\\'")}')">
                    ${String.fromCharCode(65+j)}. ${o}
                  </button>
                `).join('')}
                <div id="feedback-${i}"></div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>`;
  
  // restore answered state
  const ans = answeredMcqs[mcqKey];
  Object.keys(ans).forEach(i=>{
    const {chosen, correct} = ans[i];
    styleAnswered(parseInt(i), chosen, correct, c.mcqs[parseInt(i)].exp, c.mcqs[parseInt(i)]);
  });
}

function showTab(name){
  const tabs = ['overview','subtopics','formulas','tricks','mcq'];
  tabs.forEach(t=>{
    const el = document.getElementById('tab-'+t);
    if(el) el.style.display = (t===name?'block':'none');
  });
  document.querySelectorAll('.tab').forEach((btn,i)=>{
    btn.classList.toggle('active', tabs[i]===name);
  });
}

function answerMcq(qi, chosen, key, correct, exp){
  if(answeredMcqs[key] && answeredMcqs[key][qi]) return;
  if(!answeredMcqs[key]) answeredMcqs[key]={};
  answeredMcqs[key][qi]={chosen, correct};
  styleAnswered(qi, chosen, correct, exp);
}

function styleAnswered(qi, chosen, correct, exp, mcqObj){
  const ch = DATA[currentChapter];
  const topic = ch.topics.find(t=>t.id===currentTopic);
  const c = topic.content;
  const m = mcqObj || c.mcqs[qi];
  for(let j=0;j<m.opts.length;j++){
    const btn = document.getElementById(`opt-${qi}-${j}`);
    if(!btn) continue;
    btn.disabled = true;
    if(j===correct) btn.classList.add('correct');
    else if(j===chosen && chosen!==correct) btn.classList.add('wrong');
  }
  const fb = document.getElementById(`feedback-${qi}`);
  if(fb){
    const isCorrect = chosen===correct;
    fb.className = 'ans-feedback '+(isCorrect?'correct':'wrong');
    fb.textContent = (isCorrect?'✓ Correct! ':'✗ Wrong! ')+exp;
  }
}

function openChapter(id){ currentChapter=id; currentView='chapter'; render(); }
function openTopic(id){ currentTopic=id; currentView='topic'; render(); }
function goHome(){ currentView='home'; render(); }
function goChapter(){ currentView='chapter'; render(); }

render();
</script>
