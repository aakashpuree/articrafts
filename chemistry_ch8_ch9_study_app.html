          subtopics:[
            {title:"8.1.1 Atomic, Nascent & Active Hydrogen",body:"<b>Atomic Hydrogen</b>: Single H atoms formed by passing H₂ through an electric arc between tungsten electrodes. Very reactive, short-lived.<br><b>Nascent Hydrogen</b>: Hydrogen at the moment of liberation from a chemical reaction. E.g., Zn + H₂SO₄ → ZnSO₄ + [H] (nascent). It is a stronger reducing agent than ordinary H₂."},
            {title:"8.1.2 Isotopes of Hydrogen",body:"Three isotopes exist:<br>• Protium (¹H or H) — no neutron, most abundant (99.98%)<br>• Deuterium (²H or D) — 1 neutron, used in heavy water (D₂O)<br>• Tritium (³H or T) — 2 neutrons, radioactive, used in nuclear reactions"},

            {title:"8.1.4 Heavy Water (D₂O)",body:"D₂O is water made with deuterium. Properties: density 1.105 g/mL (heavier than H₂O), MP = 3.82°C, BP = 101.4°C. Used as moderator in nuclear reactors to slow down neutrons. Retards biological processes (toxic in large amounts)."}

      {id:"8.2",title:"Oxygen",
        content:{

          subtopics:[

            {title:"8.2.3 Types of Oxides",body:"<b>Acidic oxides</b>: oxides of non-metals, react with base → salt+water. E.g., SO₂, CO₂, NO₂<br><b>Basic oxides</b>: oxides of active metals, react with acid → salt+water. E.g., Na₂O, CaO, MgO<br><b>Amphoteric oxides</b>: react with both acid and base. E.g., Al₂O₃, ZnO<br><b>Neutral oxides</b>: react with neither. E.g., CO, NO, N₂O"}

            {q:"Which protocol banned CFCs?",opts:["Kyoto Protocol","Montreal Protocol","Paris Agreement","Geneva Protocol"],ans:1,exp:"The Montreal Protocol (1987) internationally banned substances that deplete the ozone layer."}

      {id:"8.4",title:"Nitrogen",

          subtopics:[
            {title:"8.4.1 Reasons for Inertness",body:"• Very high bond dissociation energy of N≡N (945 kJ/mol)<br>• Large ionization energy<br>• Absence of d-orbitals (can't expand octet)<br>• Small atomic size with high electronegativity<br>• Non-polar molecule"},
            {title:"8.4.2 Active Nitrogen",body:"Active nitrogen is an excited, highly reactive form of nitrogen produced by passing electric discharge through N₂ at low pressure. It contains free N atoms in excited state. It can combine with metals, phosphorus, sulfur, and many non-metals directly."},
            {title:"8.4.3 Ammonia (NH₃)",body:"Prepared industrially by Haber's process: N₂ + 3H₂ ⇌ 2NH₃ (450°C, 200 atm, Fe catalyst with Al₂O₃ and K₂O promoters). Lab: Ca(OH)₂ + 2NH₄Cl → CaCl₂ + 2H₂O + 2NH₃↑. Properties: colorless, pungent smell, basic gas, lighter than air, highly soluble in water."},
            {title:"8.4.4 Applications of Ammonia",body:"• Manufacture of fertilizers (urea, ammonium nitrate)<br>• Manufacture of HNO₃ (Ostwald's process)<br>• Refrigerant (liquid ammonia)<br>• Manufacture of explosive (nitroglycerine, TNT)<br>• Cleaning agent"},
            {title:"8.4.5 Harmful Effects of Ammonia",body:"• Irritates respiratory tract<br>• Can cause bronchitis and lung damage<br>• Toxic to aquatic life<br>• Contributes to acid rain (through reactions)<br>• Eye irritant at high concentrations"},

            {title:"8.4.7 Application of Nitric Acid",body:"• Making fertilizers (ammonium nitrate)<br>• Making explosives (TNT, nitroglycerine, gun cotton)<br>• Making dyes and drugs (nitration of aromatic compounds)<br>• Purification of gold and silver<br>• Etching of metals"},

          formulas:["N₂ + 3H₂ ⇌ 2NH₃ (Haber's process)","4NH₃ + 5O₂ → 4NO + 6H₂O (Ostwald's step 1)","2NO + O₂ → 2NO₂","3NO₂ + H₂O → 2HNO₃ + NO","Cu + 4HNO₃(conc) → Cu(NO₃)₂ + 2NO₂ + 2H₂O"],

      {id:"8.5",title:"Halogens",
        content:{
          overview:"Halogens are Group VIIA (17) elements: F, Cl, Br, I, At. The name means 'salt-forming' (Greek: halos = salt, gen = forming). They are the most reactive non-metals and are all diatomic (F₂, Cl₂, Br₂, I₂).",
          subtopics:[
            {title:"8.5.1 General Characteristics",body:"• All have 7 valence electrons (ns²np⁵), 1 electron short of noble gas<br>• High electronegativity (F is highest of all elements)<br>• Exist as diatomic molecules<br>• Strong oxidizing agents (F₂ strongest)<br>• Reactivity decreases: F > Cl > Br > I<br>• Color: F₂=pale yellow, Cl₂=yellow-green, Br₂=red-brown, I₂=violet"},
            {title:"8.5.2 Preparation of Halogens",body:"<b>Fluorine</b>: By electrolysis of KF·2HF (Moissan's method). Cannot be made by chemical oxidation.<br><b>Chlorine</b>: By Deacon's process: 4HCl + O₂ → 2Cl₂ + 2H₂O (CuCl₂ catalyst). Lab: MnO₂ + 4HCl → MnCl₂ + 2H₂O + Cl₂<br><b>Bromine</b>: By oxidation of Br⁻ with Cl₂: 2Br⁻ + Cl₂ → Br₂ + 2Cl⁻<br><b>Iodine</b>: By oxidation of I⁻ with Cl₂ or by oxidation with HNO₃"},
            {title:"8.5.3 Chemical Properties",body:"<b>With H₂</b>: All form HX. H₂ + F₂ → 2HF (even in dark, explosive). H₂ + Cl₂ → 2HCl (in sunlight). H₂ + Br₂ → 2HBr (on heating). H₂ + I₂ ⇌ 2HI (reversible, needs Pt)<br><b>With water</b>: F₂ + H₂O → 2HF + O (reacts violently). Cl₂ + H₂O ⇌ HCl + HOCl (chlorine water — bleaching).<br><b>Displacement</b>: More reactive halogen displaces less reactive from its salt."},
            {title:"8.5.4 Test for Halogens",body:"<b>Cl₂</b>: Turns moist starch-iodide paper blue; bleaches litmus paper<br><b>Br₂</b>: Gives brown fumes; turns starch paper orange-brown<br><b>I₂</b>: Turns starch solution blue-black (most specific test)<br><b>F₂</b>: Etches glass (SiO₂ + 2F₂ → SiF₄ + O₂)"}
          ],
          tricks:["Halogen colors: 'Please Call Brian Ivan' = Pale yellow, Chlorine green, Brown, Indigo/Violet (F, Cl, Br, I)","Reactivity F>Cl>Br>I (top to bottom decreases)","I₂ + starch = blue-black: most important identification test","Electronegativity F=4.0 (highest in all elements!)"],
          formulas:["MnO₂ + 4HCl → MnCl₂ + 2H₂O + Cl₂↑ (lab prep of Cl₂)","Cl₂ + H₂O ⇌ HCl + HOCl (bleaching mechanism)","2KI + Cl₂ → 2KCl + I₂ (halogen displacement)","H₂ + F₂ → 2HF (spontaneous, explosive)"],
          mcqs:[
            {q:"Which halogen is the strongest oxidizing agent?",opts:["Iodine","Bromine","Chlorine","Fluorine"],ans:3,exp:"Fluorine is the strongest oxidizing agent and most electronegative element (EN=4.0)."},

          ]

      {id:"8.6",title:"Carbon",
        content:{
          overview:"Carbon (C) has atomic number 6, electronic configuration 2,4. It shows allotropy, catenation (self-linking), and forms millions of organic compounds. Carbon forms 4 covalent bonds (tetravalent).",
          subtopics:[
            {title:"8.6.1 Introduction",body:"Carbon is unique due to:<br>• Catenation: ability to form long chains with itself<br>• Tetravalency: forms 4 bonds<br>• Multiple bonding: can form single, double, and triple bonds<br>• Small atomic size with high bond energy (C-C bond = 347 kJ/mol)"},
            {title:"8.6.2 Allotropes of Carbon",body:"<b>Diamond</b>: Each C bonded to 4 others in 3D tetrahedral structure. Hardest natural substance, non-conductor, very high melting point. sp³ hybridized.<br><b>Graphite</b>: Layered structure, each C bonded to 3 others (sp² hybrid), hexagonal rings. Good conductor (free electrons), lubricant, used in pencils.<br><b>Buckminsterfullerene (C₆₀)</b>: Spherical, 60 C atoms forming pentagons and hexagons (like football). Named after Buckminster Fuller. Superconductor at low temperatures.<br><b>Carbon nanotubes</b>: Cylindrical form, stronger than steel, good conductor."}

        content:{
          overview:"Alkali metals are Group IA (1) elements: Li, Na, K, Rb, Cs, Fr. They have 1 valence electron, are highly reactive, and always form +1 ions. They react vigorously with water, air, and most non-metals.",

            {title:"9.1.2 General Characteristics",body:"• Softest metals (can be cut with knife)<br>• Lowest ionization energies<br>• Highest electropositivity<br>• Smallest ionic radii in their period<br>• Form +1 ions only<br>• React with water: 2M + 2H₂O → 2MOH + H₂↑<br>• React with O₂: Na forms Na₂O₂ (peroxide), K forms KO₂ (superoxide), Li forms Li₂O (oxide)<br>• Flame colors: Li=crimson, Na=golden yellow, K=lilac/violet, Rb=red-violet, Cs=blue"},

            {title:"9.1.4 Sodium Hydroxide (NaOH)",body:"Also called caustic soda. Prepared industrially by Nelson's cell or Castner-Kellner cell (electrolysis of brine). Cathode: 2H₂O + 2e⁻ → H₂ + 2OH⁻. Properties: white solid, highly soluble in water, strong base, deliquescent. Uses: soap making (saponification), paper making, petroleum refining, making rayon, as drain cleaner."},

          tricks:["Alkali metals flame colors: 'Little Naughty Kids Run Crazy Fast' = Li(red), Na(yellow), K(lilac), Rb(red-violet), Cs(blue), Fr","Na forms peroxide Na₂O₂, K forms superoxide KO₂, Li forms oxide Li₂O — reactivity with O₂ increases down the group","Down's cell for Na extraction: cathode=Na, anode=Cl₂","Solvay process for Na₂CO₃: 'Salty Ammonia Creates Soda' (NaCl + NH₃ + CO₂ → Na₂CO₃)"],

let currentChapter = null;
let currentTopic = null;
let currentView = 'home';
let answeredMcqs = {};

function render(){
  const root = document.getElementById('root');
  if(currentView==='home') renderHome(root);
  else if(currentView==='chapter') renderChapter(root);
  else if(currentView==='topic') renderTopic(root);
}

function renderHome(root){
  root.innerHTML = `
    <h2 class="sr-only">NEB Class 11 Chemistry — Chapters 8 and 9 Study Guide</h2>
    <div class="home-view">
      <h1>NEB Class 11 Chemistry</h1>
      <p class="intro">Your complete study guide for Chapters 8 & 9. Click a chapter to explore all topics, subtopics, formulas, tricks, and MCQs.</p>
      ${Object.values(DATA).map(ch=>`
        <button class="chapter-btn" onclick="openChapter('${ch.id}')">
          <div>
            <div class="chapter-title">Chapter ${ch.num}: ${ch.title}</div>
            <div class="chapter-sub">${ch.topics.length} topics · Formulas · MCQs · Short tricks</div>
          </div>
          <i class="ti ti-chevron-right chevron" aria-hidden="true"></i>
        </button>
      `).join('')}
    </div>`;
}

function renderChapter(root){
  const ch = DATA[currentChapter];
  root.innerHTML = `
    <button class="back-btn" onclick="goHome()"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back</button>
    <div style="margin-bottom:1rem">
      <h1 style="font-size:22px;font-weight:500;color:${ch.color};margin-bottom:4px">Chapter ${ch.num}: ${ch.title}</h1>
      <p style="font-size:13px;color:var(--color-text-secondary)">${ch.topics.length} topics — click any topic to study it in detail</p>
    </div>
    <div class="topics-list">
      ${ch.topics.map(t=>`
        <button class="topic-btn" onclick="openTopic('${t.id}')">
          <b>${t.id}</b> — ${t.title}
        </button>
      `).join('')}
    </div>
    <div style="padding:10px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);font-size:13px;color:var(--color-text-secondary)">
      <i class="ti ti-info-circle" aria-hidden="true"></i> Each topic contains: overview, subtopics, formulas, memory tricks, and MCQ practice.
    </div>`;
}

function renderTopic(root){
  const ch = DATA[currentChapter];
  const topic = ch.topics.find(t=>t.id===currentTopic);
  const c = topic.content;
  const mcqKey = currentChapter+'_'+currentTopic;
  if(!answeredMcqs[mcqKey]) answeredMcqs[mcqKey]={};

  root.innerHTML = `
    <button class="back-btn" onclick="goChapter()"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back to Chapter ${ch.num}</button>
    <div class="content-panel">
      <h2>${topic.id} — ${topic.title}</h2>
      <div class="breadcrumb">Chapter ${ch.num} › ${topic.title}</div>
      
      <div class="tab-bar" id="tabBar">
        <button class="tab active" onclick="showTab('overview')">Overview</button>
        <button class="tab" onclick="showTab('subtopics')">Subtopics</button>
        <button class="tab" onclick="showTab('formulas')">Formulas</button>
        <button class="tab" onclick="showTab('tricks')">Memory Tricks</button>
        <button class="tab" onclick="showTab('mcq')">MCQ Practice</button>
      </div>
      
      <div id="tabContent">
        <div id="tab-overview">
          <div class="section">
            <h3>Overview</h3>
            <p>${c.overview}</p>
          </div>
        </div>
        <div id="tab-subtopics" style="display:none">
          ${c.subtopics.map(s=>`
            <div class="section">
              <h3>${s.title}</h3>
              <p>${s.body}</p>
            </div>
          `).join('')}
        </div>
        <div id="tab-formulas" style="display:none">
          <div class="section">
            <h3>Key Formulas & Reactions</h3>
            ${c.formulas.map(f=>`<div class="formula-box">${f}</div>`).join('')}
          </div>
        </div>
        <div id="tab-tricks" style="display:none">
          <div class="section">
            <h3>Memory Tricks & Mnemonics</h3>
            ${c.tricks.map(t=>`<div class="trick-box"><div class="trick-title">✦ TRICK</div><p>${t}</p></div>`).join('')}
          </div>
        </div>
        <div id="tab-mcq" style="display:none">
          <div class="mcq-section">
            <h3>MCQ Practice Questions</h3>
            ${c.mcqs.map((m,i)=>`
              <div class="mcq" id="mcq-${i}">
                <div class="q">Q${i+1}. ${m.q}</div>
                ${m.opts.map((o,j)=>`
                  <button class="opt" id="opt-${i}-${j}" onclick="answerMcq(${i},${j},'${mcqKey}',${m.ans},'${m.exp.replace(/'/g,"\\'")}')">
                    ${String.fromCharCode(65+j)}. ${o}
                  </button>
                `).join('')}
                <div id="feedback-${i}"></div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>`;
  
  // restore answered state
  const ans = answeredMcqs[mcqKey];
  Object.keys(ans).forEach(i=>{
    const {chosen, correct} = ans[i];
    styleAnswered(parseInt(i), chosen, correct, c.mcqs[parseInt(i)].exp, c.mcqs[parseInt(i)]);
  });
}

function showTab(name){
  const tabs = ['overview','subtopics','formulas','tricks','mcq'];
  tabs.forEach(t=>{
    const el = document.getElementById('tab-'+t);
    if(el) el.style.display = (t===name?'block':'none');
  });
  document.querySelectorAll('.tab').forEach((btn,i)=>{
    btn.classList.toggle('active', tabs[i]===name);
  });
}

function answerMcq(qi, chosen, key, correct, exp){
  if(answeredMcqs[key] && answeredMcqs[key][qi]) return;
  if(!answeredMcqs[key]) answeredMcqs[key]={};
  answeredMcqs[key][qi]={chosen, correct};
  styleAnswered(qi, chosen, correct, exp);
}

function styleAnswered(qi, chosen, correct, exp, mcqObj){
  const ch = DATA[currentChapter];
  const topic = ch.topics.find(t=>t.id===currentTopic);
  const c = topic.content;
  const m = mcqObj || c.mcqs[qi];
  for(let j=0;j<m.opts.length;j++){
    const btn = document.getElementById(`opt-${qi}-${j}`);
    if(!btn) continue;
    btn.disabled = true;
    if(j===correct) btn.classList.add('correct');
    else if(j===chosen && chosen!==correct) btn.classList.add('wrong');
  }
  const fb = document.getElementById(`feedback-${qi}`);
  if(fb){
    const isCorrect = chosen===correct;
    fb.className = 'ans-feedback '+(isCorrect?'correct':'wrong');
    fb.textContent = (isCorrect?'✓ Correct! ':'✗ Wrong! ')+exp;
  }
}

function openChapter(id){ currentChapter=id; currentView='chapter'; render(); }
function openTopic(id){ currentTopic=id; currentView='topic'; render(); }
function goHome(){ currentView='home'; render(); }
function goChapter(){ currentView='chapter'; render(); }

render();
</script>
